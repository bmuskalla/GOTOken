[project]
name = "gotoken-export"
version = "0.1.0"
description = "Exports SmolLM2-135M weights and tokenizer into flat binaries for the BASIC engine"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "safetensors>=0.4",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
]
